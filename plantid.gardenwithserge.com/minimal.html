<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minimal Test</title>
    <style>
        body {
            background: linear-gradient(120deg, #e6fffa 0%, #d1fae5 100%);
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            pointer-events: none;
            background: url('https://gardenwithserge.com/cactus-flower-bg.png') no-repeat top right;
            background-size: 400px auto;
            opacity: 0.18;
            z-index: 0;
        }
        input, textarea, select, button {
            background: #fff !important;
            color: #222 !important;
            border: 1px solid #d1fae5 !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>
<form method="post" enctype="multipart/form-data">
    <input type="date" name="entry_date" required><br>
    <textarea name="entry_content" required rows="4"></textarea><br>
    <input type="file" name="entry_photo" accept="image/*"><br>
    <button type="submit">Add Entry</button>
</form>
</body>
</html>
